name: FoodHub MLOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        pip install --no-cache-dir -r deployment/requirements.txt

    - name: Run validation
      run: |
        python scripts/validate_customer.py

    - name: Build Docker image
      run: |
        docker build -f deployment/Dockerfile -t foodhub-chatbot .

    - name: Manual deploy step
      run: echo "Deploy manually to Hugging Face Spaces with Docker SDK"
